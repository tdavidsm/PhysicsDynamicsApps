<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Physics Dynamics Apps</title>
<style>
  :root{ --bg:#0f1830; --panel:#16213e; --panel2:#1d2b52; --ink:#eaf0ff; --muted:#9fb0d6; --line:#2c3d6b; --accent:#ffd166; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(1200px 700px at 70% -10%, #1a2a52 0%, var(--bg) 55%);
    color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a2748,#131f3c)}
  header h1{font-size:21px;margin:0}
  header p{margin:3px 0 0;color:var(--muted);font-size:13px}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;transition:.12s}
  a.card:hover{border-color:var(--accent);background:#20315c}
  .em{font-size:34px}
  .t{font-weight:800;font-size:17px;margin:4px 0}
  .d{font-size:14px;color:var(--muted);line-height:1.5}
  .tags{margin-top:8px;font-size:12px;color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <h1>⚙️ Physics Dynamics Apps</h1>
  <p>Games and simulations about forces, impulse, momentum and collisions.</p>
</header>
<div class="wrap">
  <div class="grid">
    <a class="card" href="momentum-stones/">
      <div class="em">🥌</div>
      <div class="t">Momentum Stones</div>
      <div class="d">Plan pushes on frictionless ice to knock gold stones into the center and red stones out before the clock runs out.</div>
      <div class="tags">F = ma · impulse · momentum · collisions</div>
    </a>
  </div>
</div>
</body>
</html>
